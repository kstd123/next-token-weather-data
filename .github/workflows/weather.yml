name: Update public MeteoSwiss mountain forecasts
run-name: "MeteoSwiss | ${{ inputs.trigger_source || github.event_name }} | ${{ inputs.request_id || 'manual' }}"
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      trigger_source:
        description: 'Origin of the update request'
        type: choice
        options: [manual, cloudflare]
        default: manual
      request_id:
        description: 'Scheduler correlation ID (no user data)'
        type: string
        required: false
permissions:
  contents: write
concurrency:
  group: weather-data
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
      - run: node scripts/update-weather.mjs
      - name: Publish public data only
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add weather
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "data: update official MeteoSwiss forecast"
          git push
